runConfig:
  maxInstances: 3
  concurrency: 10
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://d100.space
    availability:
      - BUILD
      - RUNTIME

  - variable: SPOTIFY_CLIENT_ID
    value: d2b1062b484a46ea8c04de05d569de89
    availability:
      - BUILD
      - RUNTIME

  - variable: SPOTIFY_CLIENT_SECRET
    secret: projects/4289428408/secrets/SPOTIFY_CLIENT_SECRET/versions/latest
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: projects/4289428408/secrets/FIREBASE_PRIVATE_KEY/versions/latest
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_CLIENT_EMAIL
    secret: projects/4289428408/secrets/FIREBASE_CLIENT_EMAIL/versions/latest
    availability:
      - BUILD
      - RUNTIME
